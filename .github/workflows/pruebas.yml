# Lanza las pruebas de ez-ui (repositorio privado IISSI-US/ez-ui-tests) en cada push a
# una rama. El resultado aparece en el commit (ez-ui-tests, ✔ o ✖). Necesita el secreto
# EZ_UI_TESTS_TOKEN; sin él, no hace nada. Una etiqueta no las lanza: su commit ya se
# probó al subirlo, y volver a probarlo dejaría su estado «en curso».
name: Pruebas

on:
  push:
    branches: ["**"]

jobs:
  avisar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.EZ_UI_TESTS_TOKEN }}
    steps:
      - name: Lanza las pruebas en ez-ui-tests
        if: env.GH_TOKEN != ''
        run: >
          gh api repos/IISSI-US/ez-ui-tests/dispatches
          -f event_type=ez-ui-push
          -f "client_payload[sha]=$GITHUB_SHA"
          -f "client_payload[ref]=$GITHUB_REF_NAME"
