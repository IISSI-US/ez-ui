# Publicación manual de versiones desde tags vX.Y.Z.
# Los ZIP se guardan como artefactos versionados en la rama pages-downloads,
# que el workflow de Pages integra en el sitio.
name: Preparar ZIP
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar versión y empaquetar
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 scripts/package.py "$VERSION" "ez-ui-$VERSION.zip"
          python3 -m zipfile -t "ez-ui-$VERSION.zip"
      - name: Conservar versiones en rama de descargas
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/ez-ui-package
          cp "ez-ui-$VERSION.zip" /tmp/ez-ui-package/
          git fetch origin pages-downloads || true
          if git show-ref --verify --quiet refs/remotes/origin/pages-downloads; then
            git switch -c pages-downloads origin/pages-downloads
          else
            git switch --orphan pages-downloads
            git rm -rf . >/dev/null
          fi
          mkdir -p downloads
          FILE="downloads/ez-ui-$VERSION.zip"
          if test -e "$FILE"; then
            cmp "$FILE" "/tmp/ez-ui-package/ez-ui-$VERSION.zip"
          else
            cp "/tmp/ez-ui-package/ez-ui-$VERSION.zip" "$FILE"
            git add "$FILE"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "release: conservar ez-ui $VERSION"
            git push origin pages-downloads
          fi
